<svg xmlns="http://www.w3.org/2000/svg" width="960" height="640" viewBox="0 0 960 640" role="img" aria-labelledby="title desc">
  <title id="title">First quote follow-up message example</title>
  <desc id="desc">A mobile phone mockup showing the first ReKnock quote follow-up message with contractor identity, ReKnock identity, message and data rates disclosure, and STOP opt-out language.</desc>
  <rect width="960" height="640" fill="#f6f9ff"/>
  <rect x="320" y="48" width="320" height="544" rx="42" fill="#0f172a"/>
  <rect x="338" y="76" width="284" height="488" rx="28" fill="#ffffff"/>
  <rect x="424" y="62" width="112" height="8" rx="4" fill="#334155"/>

  <text x="374" y="122" font-family="Inter, Arial, sans-serif" font-size="15" font-weight="700" fill="#0f172a">Apex Roofing via ReKnock</text>
  <line x1="338" y1="146" x2="622" y2="146" stroke="#e2e8f0"/>

  <rect x="360" y="184" width="238" height="198" rx="18" fill="#eef4ff" stroke="#cfe0f8"/>
  <text x="380" y="220" font-family="Inter, Arial, sans-serif" font-size="17" fill="#172033">Hi Sarah, it's Mike with</text>
  <text x="380" y="248" font-family="Inter, Arial, sans-serif" font-size="17" fill="#172033">Apex Roofing through</text>
  <text x="380" y="276" font-family="Inter, Arial, sans-serif" font-size="17" fill="#172033">ReKnock, following up on</text>
  <text x="380" y="304" font-family="Inter, Arial, sans-serif" font-size="17" fill="#172033">the roof quote we discussed.</text>
  <text x="380" y="332" font-family="Inter, Arial, sans-serif" font-size="17" fill="#172033">Any questions I can answer?</text>
  <text x="380" y="364" font-family="Inter, Arial, sans-serif" font-size="15" fill="#475569">Msg &amp; data rates may apply.</text>
  <text x="380" y="390" font-family="Inter, Arial, sans-serif" font-size="15" fill="#475569">Reply STOP to opt out</text>

  <rect x="360" y="420" width="238" height="64" rx="18" fill="#f8fafc" stroke="#e2e8f0"/>
  <text x="382" y="459" font-family="Inter, Arial, sans-serif" font-size="17" fill="#64748b">Homeowner replies here...</text>

  <text x="80" y="116" font-family="Inter, Arial, sans-serif" font-size="34" font-weight="700" fill="#0f172a">First message includes</text>
  <text x="80" y="158" font-family="Inter, Arial, sans-serif" font-size="34" font-weight="700" fill="#0f172a">the required disclosure</text>
  <circle cx="104" cy="230" r="8" fill="#1d5fdb"/>
  <text x="124" y="237" font-family="Inter, Arial, sans-serif" font-size="20" fill="#172033">Contractor identity</text>
  <circle cx="104" cy="276" r="8" fill="#1d5fdb"/>
  <text x="124" y="283" font-family="Inter, Arial, sans-serif" font-size="20" fill="#172033">ReKnock identity</text>
  <circle cx="104" cy="322" r="8" fill="#1d5fdb"/>
  <text x="124" y="329" font-family="Inter, Arial, sans-serif" font-size="20" fill="#172033">Msg &amp; data rates</text>
  <circle cx="104" cy="368" r="8" fill="#1d5fdb"/>
  <text x="124" y="375" font-family="Inter, Arial, sans-serif" font-size="20" fill="#172033">STOP opt-out</text>
</svg>
