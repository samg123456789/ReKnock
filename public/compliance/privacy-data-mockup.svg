<svg xmlns="http://www.w3.org/2000/svg" width="960" height="560" viewBox="0 0 960 560" role="img" aria-labelledby="title desc">
  <title id="title">ReKnock privacy and consent data use example</title>
  <desc id="desc">A diagram showing that ReKnock stores quote follow-up details and consent records, sends messages through service providers, and does not share mobile information for marketing.</desc>
  <rect width="960" height="560" fill="#f6f9ff"/>
  <text x="72" y="88" font-family="Inter, Arial, sans-serif" font-size="34" font-weight="700" fill="#0f172a">How mobile information is used</text>
  <text x="72" y="124" font-family="Inter, Arial, sans-serif" font-size="18" fill="#475569">Stored only to operate quote follow-up texts and consent records.</text>

  <rect x="72" y="180" width="220" height="172" rx="8" fill="#ffffff" stroke="#d7e4f5" stroke-width="2"/>
  <text x="104" y="224" font-family="Inter, Arial, sans-serif" font-size="20" font-weight="700" fill="#0f172a">Contractor quote</text>
  <text x="104" y="262" font-family="Inter, Arial, sans-serif" font-size="17" fill="#475569">Name</text>
  <text x="104" y="292" font-family="Inter, Arial, sans-serif" font-size="17" fill="#475569">Mobile number</text>
  <text x="104" y="322" font-family="Inter, Arial, sans-serif" font-size="17" fill="#475569">Quote details</text>

  <rect x="370" y="164" width="220" height="204" rx="8" fill="#eef4ff" stroke="#cfe0f8" stroke-width="2"/>
  <text x="402" y="208" font-family="Inter, Arial, sans-serif" font-size="20" font-weight="700" fill="#0f172a">ReKnock stores</text>
  <text x="402" y="246" font-family="Inter, Arial, sans-serif" font-size="17" fill="#475569">Consent version</text>
  <text x="402" y="276" font-family="Inter, Arial, sans-serif" font-size="17" fill="#475569">Consent timestamp</text>
  <text x="402" y="306" font-family="Inter, Arial, sans-serif" font-size="17" fill="#475569">Message history</text>
  <text x="402" y="336" font-family="Inter, Arial, sans-serif" font-size="17" fill="#475569">Opt-out status</text>

  <rect x="668" y="180" width="220" height="172" rx="8" fill="#ffffff" stroke="#d7e4f5" stroke-width="2"/>
  <text x="700" y="224" font-family="Inter, Arial, sans-serif" font-size="20" font-weight="700" fill="#0f172a">SMS delivery</text>
  <text x="700" y="262" font-family="Inter, Arial, sans-serif" font-size="17" fill="#475569">Service providers</text>
  <text x="700" y="292" font-family="Inter, Arial, sans-serif" font-size="17" fill="#475569">needed to send</text>
  <text x="700" y="322" font-family="Inter, Arial, sans-serif" font-size="17" fill="#475569">the quote texts</text>

  <path d="M304 266h54" stroke="#94a3b8" stroke-width="3" stroke-linecap="round"/>
  <path d="M346 254l12 12-12 12" fill="none" stroke="#94a3b8" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M602 266h54" stroke="#94a3b8" stroke-width="3" stroke-linecap="round"/>
  <path d="M644 254l12 12-12 12" fill="none" stroke="#94a3b8" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>

  <rect x="72" y="420" width="816" height="72" rx="8" fill="#ecfdf3" stroke="#bde7ca"/>
  <text x="104" y="464" font-family="Inter, Arial, sans-serif" font-size="22" font-weight="700" fill="#14532d">No mobile information is shared with third parties or affiliates for marketing or promotional purposes.</text>
</svg>
